<!DOCTYPE html>
<html class="staticrypt-html">
<head>
<meta charset="utf-8"/>
<title>Contoso Medical Finance &amp; Procurement · Copilot Immersion</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="cache-control" content="no-cache"/>
<meta http-equiv="pragma" content="no-cache"/>
<style>
:root{--accent:#0284c7;}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#0e1633;--ink:#e2e8f0;--muted:#94a3b8;--border:#1e2d4a;--input-bg:#0a0f24;--danger:#ef4444;}}
@media(prefers-color-scheme:light){:root{--bg:#f0f4f8;--panel:#fff;--ink:#1a202c;--muted:#64748b;--border:#d1d9e6;--input-bg:#eef2f7;--danger:#dc2626;}}
*,*::before,*::after{box-sizing:border-box;}
.staticrypt-html,.staticrypt-body{height:100%;margin:0;}
.staticrypt-content{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse at 30% 40%,rgba(0,60,100,.45),transparent 60%),var(--bg);}
.staticrypt-spinner-container{position:fixed;inset:0;background:#0b1020;display:flex;align-items:center;justify-content:center;}
.staticrypt-spinner{width:2rem;height:2rem;border:.25em solid #334155;border-right-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}
.staticrypt-page{width:100%;max-width:440px;padding:0 20px;}
.staticrypt-form{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:40px 44px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.staticrypt-logo{width:56px;height:56px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;margin:0 auto 18px;}
.staticrypt-title{font-size:19px;font-weight:700;color:var(--ink);margin:0 0 6px;}
.staticrypt-instructions{color:var(--muted);font-size:14px;margin:0 0 20px;}
.staticrypt-hr{border:0;border-top:1px solid var(--border);margin:0 0 20px;}
.staticrypt-password-container{position:relative;margin-bottom:12px;}
.staticrypt-form input[type=password],.staticrypt-form input[type=text]{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--ink);font-size:15px;padding:12px 44px 12px 16px;outline:none;font-family:inherit;transition:border-color .2s;}
.staticrypt-form input:focus{border-color:var(--accent);}
.staticrypt-toggle-password-visibility{cursor:pointer;height:18px;width:18px;opacity:40%;position:absolute;right:14px;top:50%;transform:translateY(-50%);}
@media(prefers-color-scheme:dark){.staticrypt-toggle-password-visibility{filter:invert(1);opacity:55%;}}
.staticrypt-form .staticrypt-decrypt-button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;padding:13px;cursor:pointer;font-family:inherit;transition:filter .2s;margin-top:4px;}
.staticrypt-form .staticrypt-decrypt-button:hover{filter:brightness(90%);}
input[type="password"]::-ms-reveal{display:none;}
input[type="password"]::-webkit-contacts-auto-fill-button{visibility:hidden;}
.hidden{display:none!important;}
</style>
</head>
