            .staticrypt-form {

                letter-spacing: -0.5px; color: #fff; margin: 0 auto 18px;

            .staticrypt-title { font-size: 20px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }

            .staticrypt-instructions p { margin: 4px 0; }
            .staticrypt-hr { border: 0; border-top: 1px solid var(--border); margin: 0 0 20px; }
            .staticrypt-password-container { position: relative; margin-bottom: 12px; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                width: 100%; background: var(--input-bg); border: 1px solid var(--border);
                border-radius: 10px; color: var(--ink); font-size: 15px; padding: 12px 44px 12px 16px;

            .staticrypt-form input[type="password"]:focus, .staticrypt-form input[type="text"]:focus {
                border-color: var(--accent);
            }
            .staticrypt-toggle-password-visibility {

                position: absolute; right: 14px; top: 50%; transform: translateY(-50%); padding: 0;
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility { filter: invert(1); opacity: 55%; }
            }
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
                font-size: 15px; font-weight: 700; padding: 13px; cursor: pointer; font-family: inherit;
